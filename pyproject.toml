[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mammography-report-generation"
version = "1.0.0"
description = "Génération automatique de rapports mammographiques BI-RADS par IA (CLIP bi-vues + LLM)"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["src"]
